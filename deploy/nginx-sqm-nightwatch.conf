# /etc/nginx/sites-available/sqm-nightwatch.conf
#
# Vhost nginx pour SQM Nightwatch — VERSION HTTP ONLY
#
# certbot --nginx ajoutera automatiquement le bloc HTTPS (443) + la redirection
# 80->443 en modifiant ce fichier. Ne le remplissez PAS à l'avance avec
# des directives SSL : les fichiers /etc/letsencrypt/options-ssl-nginx.conf,
# ssl-dhparams.pem et fullchain.pem n'existent qu'APRÈS la 1ère émission.
#
# Après modif :
#   ln -sf /etc/nginx/sites-available/sqm-nightwatch.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d sqm.example.com --redirect

server {
    listen 80;
    listen [::]:80;
    server_name sqm.example.com;   # « ← à remplacer par votre domaine »

    # Pour l'émission/renouvellement certbot (HTTP-01 webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Taille max upload (faible, pas d'upload utile ici)
    client_max_body_size 256k;

    # En-têtes de sécurité raisonnables
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ----- Frontend statique (React build) ----------------------------------
    root /opt/sqm-nightwatch/frontend/build;
    index index.html;

    # Routage côté client (react-router) : /, /setup, etc.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long sur les assets hashés
    location /static/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ----- Backend API (FastAPI/uvicorn) ------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_cache_bypass $http_upgrade;
    }
}

# -----------------------------------------------------------------------------
# Après exécution de :
#   sudo certbot --nginx -d sqm.example.com --redirect
#
# certbot va AUTOMATIQUEMENT :
#   - ajouter un 2e bloc `server { listen 443 ssl http2; ... }` avec les bons
#     chemins ssl_certificate / ssl_certificate_key
#   - inclure /etc/letsencrypt/options-ssl-nginx.conf (paramètres TLS modernes)
#   - transformer ce bloc HTTP en simple redirection vers HTTPS
#   - configurer le renouvellement auto via le timer systemd certbot.timer
#
# Vous n'avez rien à écrire à la main pour le bloc HTTPS.
# -----------------------------------------------------------------------------

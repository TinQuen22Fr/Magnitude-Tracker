# /etc/nginx/sites-available/sqm-nightwatch.conf — HTTPS + HTTP/3 (QUIC)
#
# IMPORTANT : ce fichier remplace nginx-sqm-nightwatch.conf APRÈS que certbot
# ait émis votre certificat. Le flux complet est :
#
#   1. Installer d'abord nginx-sqm-nightwatch.conf (HTTP-only) — celui qui est
#      utilisé par install.sh par défaut.
#   2. Faire émettre le certificat par certbot :
#         sudo certbot --nginx -d sqm.example.com --redirect
#   3. Remplacer le vhost par CE fichier (HTTPS + HTTP/3) :
#         sudo cp deploy/nginx-sqm-nightwatch-http3.conf \
#                 /etc/nginx/sites-available/sqm-nightwatch.conf
#         sudo sed -i 's/sqm.example.com/votre.domaine.tld/g' \
#                 /etc/nginx/sites-available/sqm-nightwatch.conf
#         sudo nginx -t && sudo systemctl reload nginx
#   4. Ouvrir UDP/443 dans le pare-feu (HTTP/3 utilise UDP, pas TCP).
#
# PRÉREQUIS :
#   - nginx >= 1.25.0 compilé avec --with-http_v3_module
#     (Debian 13 / Ubuntu 24.04 OK, sinon utiliser le repo nginx mainline)
#   - vérifier :  nginx -V 2>&1 | grep -o with-http_v3_module
#   - QUIC fonctionnel sur votre serveur (vous l'avez confirmé)
#   - UDP/443 ouvert (ufw / iptables / fournisseur)
#
# Test rapide HTTP/3 une fois en place :
#   curl --http3-only -I https://votre.domaine.tld
#   (curl >= 7.88 compilé avec http3)
#   ou : https://http3check.net/?host=votre.domaine.tld

# -----------------------------------------------------------------------------
# Redirection HTTP -> HTTPS
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name sqm.example.com;     # ← à remplacer

    # Renouvellement certbot (HTTP-01)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}

# -----------------------------------------------------------------------------
# HTTPS — TCP (HTTP/2) + UDP (HTTP/3 QUIC)
# -----------------------------------------------------------------------------
server {
    # HTTP/1.1 + HTTP/2 sur TCP
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # HTTP/3 (QUIC) sur UDP
    #
    # NOTE IMPORTANTE — option `reuseport` :
    # `reuseport` ne doit être déclarée que sur UN SEUL server block par
    # couple (adresse:port) à travers TOUS les vhosts nginx. Si un autre
    # vhost (ex: storm-monitor) a déjà `listen 443 quic reuseport;`, nginx
    # refusera de démarrer avec :
    #   nginx: emerg: duplicate listen options for 0.0.0.0:443
    # Le script `enable-http3.sh` détecte automatiquement ce cas et
    # supprime `reuseport` ici. Si vous installez manuellement, vérifiez :
    #   grep -rE 'quic\s+reuseport' /etc/nginx/sites-enabled/
    # et gardez `reuseport` sur UN SEUL vhost (n'importe lequel).
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    http3 on;
    http3_hq off;             # on garde HTTP-over-QUIC standard, pas HQ
    quic_retry on;            # protection anti-amplification basique

    server_name sqm.example.com;     # ← à remplacer

    # ----- TLS ---------------------------------------------------------------
    # Chemins gérés par certbot après émission du certificat
    ssl_certificate     /etc/letsencrypt/live/sqm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sqm.example.com/privkey.pem;

    # Paramètres TLS modernes injectés par certbot.
    # `options-ssl-nginx.conf` définit DÉJÀ ssl_protocols, ssl_ciphers, etc.
    # → ne PAS redéclarer ssl_protocols ici (sinon "duplicate value" warning).
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # OCSP stapling (optionnel mais propre)
    ssl_stapling on;
    ssl_stapling_verify on;

    # ----- Annonce HTTP/3 ----------------------------------------------------
    # Indique au client (Chrome/Firefox/Safari récents) qu'HTTP/3 est dispo.
    # ma=86400 : durée d'annonce 24h.
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    # Optionnel : "X-Quic" pour debug
    add_header X-Quic 'h3' always;

    # ----- En-têtes de sécurité ----------------------------------------------
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Taille max upload
    client_max_body_size 256k;

    # ----- Frontend statique (build React) -----------------------------------
    root /opt/sqm-nightwatch/frontend/build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /static/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
    }

    # ----- Backend API (FastAPI/uvicorn) -------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_cache_bypass $http_upgrade;
    }
}
